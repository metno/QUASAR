[project]
name = "quasar"
version = "1.0.0"
description = "QUAntile-based neural network reconstruction for near-Surface Atmospheric vaRiables"
readme = "README.md"
authors = [
    { name = "Manuel Carrer", email = "manuel.carrer@met.no" },
    { name = "Jari Miglio", email = "jari.miglio@met.no" },
    { name = "Gianluca Turin", email = "gianluca.turin@met.no" },
]
requires-python = ">=3.12"
dependencies = [
    "jaxtyping>=0.3.2",
    "msgspec>=0.19.0",
    "numpy>=2.2.1",
    "optuna>=4.6.0",
    "pandas>=2.2.3",
    "pandas-stubs>=2.2.3.241126",
    "polars>=1.33.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "tomli-w>=1.2.0",
    "torch>=2.7.0",
]

[project.scripts]
quasar = "quasar.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ipykernel>=6.29.5",
    "pyqt6>=6.9.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
